name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: |
          xcodebuild -list -project ThreeOneOSFive.xcodeproj
          xcodebuild -project ThreeOneOSFive.xcodeproj -scheme 3105 -configuration Release -sdk iphoneos -archivePath build.xcarchive archive CODE_SIGNING_ALLOWED=NO -destination generic/platform=iOS
          mkdir -p Payload
          cp -R build.xcarchive/Products/Applications/*.app Payload/
          zip -r ThreeOneOSFive.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: ThreeOneOSFive.ipa
