name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build IPA
        run: |
          PROJ=$(find. -name "*.xcodeproj" | head -n 1)
          xcodebuild -project "$PROJ" -configuration Release -sdk iphoneos -archivePath build.xcarchive archive CODE_SIGNING_ALLOWED=NO
          mkdir -p Payload
          cp -R build.xcarchive/Products/Applications/*.app Payload/
          zip -r 3105.ipa Payload
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: 3105.ipa
