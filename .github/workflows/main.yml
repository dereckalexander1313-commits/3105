name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build IPA
        run: |
          BRIDGE=$(find. -name "*Bridging-Header*" | head -n 1)
          echo "Bridging header encontrado: $BRIDGE"
          xcodebuild -project ThreeOneOSFive.xcodeproj -scheme 3105 -configuration Release -sdk iphoneos -archivePath build.xcarchive archive CODE_SIGNING_ALLOWED=NO SWIFT_OBJC_BRIDGING_HEADER="$BRIDGE" -destination generic/platform=iOS
          mkdir -p Payload
          cp -R build.xcarchive/Products/Applications/*.app Payload/
          zip -r ThreeOneOSFive.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA
          path: ThreeOneOSFive.ipa
