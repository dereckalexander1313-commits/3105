name: Build IPA
on: [push]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Fix Project and Build
        run: |
          # Esto borra la referencia al Bridging Header que es lo que te da el exit 65
          sed -i '' '/BRIDGING_HEADER/d' ThreeOneOSFive.xcodeproj/project.pbxproj || true
          sed -i '' '/SWIFT_OBJC_BRIDGING_HEADER/d' ThreeOneOSFive.xcodeproj/project.pbxproj || true
          rm -f ThreeOneOSFive/ThreeOneOSFive-Bridging-Header.h || true
          rm -f ThreeOneOSFive-Bridging-Header.h || true

          xcodebuild -project ThreeOneOSFive.xcodeproj -scheme 3105 -configuration Release -sdk iphoneos -archivePath build.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO -destination generic/platform=iOS
          mkdir -p Payload
          cp -R build.xcarchive/Products/Applications/*.app Payload/
          zip -r ThreeOneOSFive.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: 3105-IPA-FINAL
          path: ThreeOneOSFive.ipa
